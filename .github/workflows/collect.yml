name: Collect ridership
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub batches scheduled runs; expect ~15-25 min gaps
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
      - run: |
          git config user.name "bussin-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "collect $(date -u +%FT%TZ)" || echo "no new rows"
          git push
